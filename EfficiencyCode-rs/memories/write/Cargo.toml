[package]
edition.workspace = true
license.workspace = true
name = "EfficiencyCode-memories-write"
version.workspace = true

[lib]
name = "EfficiencyCode_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
EfficiencyCode-backend-client = { workspace = true }
EfficiencyCode-core = { workspace = true }
EfficiencyCode-config = { workspace = true }
EfficiencyCode-features = { workspace = true }
EfficiencyCode-git-utils = { workspace = true }
EfficiencyCode-login = { workspace = true }
EfficiencyCode-model-provider = { workspace = true }
EfficiencyCode-otel = { workspace = true }
EfficiencyCode-protocol = { workspace = true }
EfficiencyCode-rollout = { workspace = true }
EfficiencyCode-rollout-trace = { workspace = true }
EfficiencyCode-secrets = { workspace = true }
EfficiencyCode-state = { workspace = true }
EfficiencyCode-terminal-detection = { workspace = true }
EfficiencyCode-utils-absolute-path = { workspace = true }
EfficiencyCode-utils-output-truncation = { workspace = true }
EfficiencyCode-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
EfficiencyCode-model-provider-info = { workspace = true }
EfficiencyCode-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
