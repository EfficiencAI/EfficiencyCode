[package]
name = "EfficiencyCode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "EfficiencyCode"

[[bin]]
name = "EfficiencyCode"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[lib]
name = "EfficiencyCode_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
EfficiencyCode-app-server = { workspace = true }
EfficiencyCode-app-server-daemon = { workspace = true }
EfficiencyCode-app-server-protocol = { workspace = true }
EfficiencyCode-app-server-test-client = { workspace = true }
EfficiencyCode-arg0 = { workspace = true }
EfficiencyCode-api = { workspace = true }
EfficiencyCode-chatgpt = { workspace = true }
EfficiencyCode-cloud-config = { workspace = true }
EfficiencyCode-cloud-tasks = { path = "../cloud-tasks" }
EfficiencyCode-utils-cli = { workspace = true }
EfficiencyCode-config = { workspace = true }
EfficiencyCode-core = { workspace = true }
EfficiencyCode-core-plugins = { workspace = true }
EfficiencyCode-history = { workspace = true }
EfficiencyCode-home = { workspace = true }
EfficiencyCode-http-client = { workspace = true }
EfficiencyCode-exec = { workspace = true }
EfficiencyCode-exec-server = { workspace = true }
EfficiencyCode-execpolicy = { workspace = true }
EfficiencyCode-extension-api = { workspace = true }
EfficiencyCode-features = { workspace = true }
EfficiencyCode-git-attribution = { workspace = true }
EfficiencyCode-git-utils = { workspace = true }
EfficiencyCode-install-context = { workspace = true }
EfficiencyCode-login = { workspace = true }
EfficiencyCode-memories-write = { workspace = true }
EfficiencyCode-mcp = { workspace = true }
EfficiencyCode-mcp-server = { workspace = true }
EfficiencyCode-model-provider = { workspace = true }
EfficiencyCode-models-manager = { workspace = true }
EfficiencyCode-plugin = { workspace = true }
EfficiencyCode-protocol = { workspace = true }
EfficiencyCode-responses-api-proxy = { workspace = true }
EfficiencyCode-rmcp-client = { workspace = true }
EfficiencyCode-rollout = { workspace = true }
EfficiencyCode-rollout-trace = { workspace = true }
EfficiencyCode-sandboxing = { workspace = true }
EfficiencyCode-skills-extension = { workspace = true }
EfficiencyCode-state = { workspace = true }
EfficiencyCode-stdio-to-uds = { workspace = true }
EfficiencyCode-terminal-detection = { workspace = true }
EfficiencyCode-thread-store = { workspace = true }
EfficiencyCode-tui = { workspace = true }
EfficiencyCode-utils-absolute-path = { workspace = true }
EfficiencyCode-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
EfficiencyCode_windows_sandbox = { package = "EfficiencyCode-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
EfficiencyCode-utils-cargo-bin = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
tokio-tungstenite = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
