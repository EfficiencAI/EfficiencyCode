[package]
edition.workspace = true
license.workspace = true
name = "EfficiencyCode-rollout"
version.workspace = true

[lib]
doctest = false
name = "EfficiencyCode_rollout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
EfficiencyCode-extension-items = { workspace = true }
EfficiencyCode-file-search = { workspace = true }
EfficiencyCode-git-utils = { workspace = true }
EfficiencyCode-history = { workspace = true }
EfficiencyCode-otel = { workspace = true }
EfficiencyCode-protocol = { workspace = true }
EfficiencyCode-state = { workspace = true }
EfficiencyCode-utils-absolute-path = { workspace = true }
EfficiencyCode-utils-path = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
EfficiencyCode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
