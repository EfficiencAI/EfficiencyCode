[package]
name = "EfficiencyCode-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "EfficiencyCode-app-server"
path = "src/main.rs"

[[bin]]
name = "EfficiencyCode-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "EfficiencyCode_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
