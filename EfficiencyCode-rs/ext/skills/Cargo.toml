[package]
edition.workspace = true
license.workspace = true
name = "EfficiencyCode-skills-extension"
version.workspace = true

[lib]
name = "EfficiencyCode_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
EfficiencyCode-analytics = { workspace = true }
EfficiencyCode-config = { workspace = true }
EfficiencyCode-exec-server = { workspace = true }
EfficiencyCode-extension-api = { workspace = true }
EfficiencyCode-mcp = { workspace = true }
EfficiencyCode-otel = { workspace = true }
EfficiencyCode-protocol = { workspace = true }
EfficiencyCode-skills = { workspace = true }
EfficiencyCode-tools = { workspace = true }
EfficiencyCode-utils-absolute-path = { workspace = true }
EfficiencyCode-utils-path-uri = { workspace = true }
EfficiencyCode-utils-plugins = { workspace = true }
EfficiencyCode-utils-string = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
EfficiencyCode-models-manager = { workspace = true }
EfficiencyCode-utils-cargo-bin = { workspace = true }
dunce = { workspace = true }
insta = { workspace = true }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
